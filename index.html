<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Overhead is a weather report that looks like the sky it describes: current conditions, the next 24 hours, a five-day outlook and air quality for any city." />
    <meta name="theme-color" content="#0d1526" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The two fonts every first paint needs. Without these the browser only finds them after parsing the CSS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2" />
    <title>Overhead — the sky, right now</title>
  </head>
  <body>
    <!-- Painted from HTML and CSS alone, so the first paint does not wait for JavaScript. React replaces it on mount. -->
    <div id="root"><div class="shell"><span class="shell-mark">Overhead</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
